action_id: verify-data-type
version: 1.0.0
target_kind: prep_sample
target_processing_kinds: [sequenced]

description: >
  Check one prep_sample's stored reads against what its prep protocol expects. Samples
  up to 10,000 raw reads, classifies them with SortMeRNA against one reference per rRNA
  marker class (16S, 18S, 23S/28S, 5S/5.8S), and persists a `data_type` QC check: the
  verdict plus the per-class fractions.

scopes:
  - prep_sample:write

# Exports the sample's raw, human-containing reads, so admin-only like read-mask.
audience:
  service: false
  human_roles: [wet_lab_admin, system_admin]

context_schema:
  type: object
  required:
    - marker_16s_reference_idx
    - marker_18s_reference_idx
    - marker_23s_28s_reference_idx
    - marker_5s_5_8s_reference_idx
  properties:
    marker_16s_reference_idx:
      type: integer
      minimum: 1
    marker_18s_reference_idx:
      type: integer
      minimum: 1
    marker_23s_28s_reference_idx:
      type: integer
      minimum: 1
    marker_5s_5_8s_reference_idx:
      type: integer
      minimum: 1

steps:
  - step: verify_data_type
    step_type: singleton
    module: qiita_compute_orchestrator.jobs.verify_data_type
    inputs: [reads, marker_16s_ref, marker_18s_ref, marker_23s_28s_ref, marker_5s_5_8s_ref]
    params:
      prep_protocol: prep_protocol
      marker_16s_reference_idx: marker_16s_reference_idx
      marker_18s_reference_idx: marker_18s_reference_idx
      marker_23s_28s_reference_idx: marker_23s_28s_reference_idx
      marker_5s_5_8s_reference_idx: marker_5s_5_8s_reference_idx
    outputs: [qc_checks]
    baseline_resources:
      cpu: 2
      mem_gb: 8
      walltime: PT1H

  - action: persist-qc-checks
    inputs: [qc_checks]
    outputs: []

action_ceiling:
  cpu: 4
  mem_gb: 32
  walltime: PT4H
