action_id: amplicon
version: 1.1.0
target_kind: sequenced_pool
# no target_processing_kinds; the run identity is the amplicon knobs, which the
# runner hashes into a processing_idx before the step loop. Reads are not
# oriented on the primer (see the amplicon_deblur job).

description: >
  Rapid 16S amplicon denoising for a sequenced pool's already-ingested reads
  (golay-demux or bcl-convert stored them in the DuckLake `read` table). Runs the
  deblur pipeline reference-agnostically: 16S reads are not host/human sequence,
  so they are not masked — the `denoise` step streams the pool's raw reads from the
  `read` table at runtime (a pool-scoped `read_block` DoGet, the same seam the block
  workflows use; the step declares no reads input) and materializes the SortMeRNA
  16S pre-filter reference (`sortmerna_ref`) from a loaded sequence_reference (by
  reference_idx, off fixed operator paths).

  The `denoise` step (native, miint) trims → per-sample dereplicates → SortMeRNA
  16S pre-filters → UCHIME chimera-filters → MAFFT-aligns → deblur-denoises into
  ASVs, emitting each ASV's canonical sequence_hash + per-sample abundance.
  `mint-features` mints a feature_idx per ASV against the shared `qiita.feature`
  space; `amplicon_load` joins the counts to the feature map and writes the
  DuckLake `amplicon_membership` (prep_sample_idx, processing_idx, feature_idx,
  count) plus the ASV sequences themselves (`amplicon_sequence` +
  `amplicon_sequence_chunks`, keyed by feature_idx, so an ASV is never recomputed
  to read back); register-files loads them. The ASV-reference-match (e.g. GG2)
  feature table is derived on demand by intersecting feature_idx with a
  reference's membership (an exact ASV match, not similarity-based
  closed-reference) — never stored here. mint-amplicon-identifiers then mints
  each processed sample's public QM identifier (exported_identifier keyed on
  processing_idx), the label a published feature table carries for it.

scopes: []

audience:
  # processing over a pool's reads; users and up, no service account.
  service: false
  human_roles: [user, wet_lab_admin, system_admin]

context_schema:
  type: object
  required: [sortmerna_reference_idx, trim]
  # a context naming an undeclared key is refused, not silently ignored.
  additionalProperties: false
  properties:
    # loaded SortMeRNA 16S reference; materialized by the runner. part of the
    # run identity (a different reference is a different result).
    sortmerna_reference_idx:
      type: integer
      minimum: 1
    # truncation length (150 for the GG2 V4 catalog). result-affecting.
    trim:
      type: integer
      minimum: 6

steps:
  # denoise into ASVs. no reads input — the pool's reads stream at runtime.
  # only sortmerna_ref is runner-resolved; the knobs ride params.
  - step: denoise
    step_type: singleton
    module: qiita_compute_orchestrator.jobs.amplicon_deblur
    inputs: [sortmerna_ref]
    params: {trim: trim}
    outputs: [asv_counts, manifest, asv_chunks]
    baseline_resources:
      cpu: 8
      mem_gb: 64
      walltime: PT8H

  # mint a feature_idx per ASV against the shared feature space.
  - action: mint-features
    inputs: [manifest]
    outputs: [feature_map]

  # join counts to the feature map, write amplicon_membership + the ASV sequence
  # tables. processing_idx rides params and signals the runner to mint it.
  - step: amplicon_load
    step_type: singleton
    module: qiita_compute_orchestrator.jobs.amplicon_load
    inputs: [asv_counts, feature_map, manifest, asv_chunks]
    params: {processing_idx: processing_idx}
    outputs: [staging_dir]
    baseline_resources:
      cpu: 2
      mem_gb: 8
      walltime: PT1H

  # load amplicon_membership (replace-keyed on prep_sample+processing) and the ASV
  # sequence tables (replace-keyed on feature_idx) into the lake.
  - action: register-files
    inputs: [staging_dir]
    outputs: []

  # mint the public QM identifier of every processed sample denoise counted, so
  # a feature table built from this run can label its samples without exposing
  # prep_sample_idx. after register-files: an identifier never names data that
  # did not land.
  - action: mint-amplicon-identifiers
    inputs: [asv_counts]
    outputs: []

  # close the run's per-sample gate (qiita.amplicon_sample): 'completed' with its
  # ASV count for each sample denoise counted, 'no_data' for the rest of the pool.
  # the runner materialized the pool's 'pending' rows when it minted the run.
  - action: finalize-amplicon-sample
    inputs: [asv_counts]
    outputs: []

action_ceiling:
  # mem_gb above the denoise baseline so a memory retry can escalate.
  cpu: 8
  mem_gb: 128
  walltime: PT12H
