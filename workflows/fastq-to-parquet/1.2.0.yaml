action_id: fastq-to-parquet
version: 1.2.0
target_kind: prep_sample
# Sequenced-only by definition: FASTQ files are sequencing artifacts.
target_processing_kinds: [sequenced]

description: >
  Additive successor to fastq-to-parquet/1.1.0: the same FASTQ→reads.parquet
  conversion (CP-minted sequence_idx) plus an ALWAYS-ON read-QC step and the
  OPTIONAL downstream host-depletion step. 1.0.0 and 1.1.0 stay available
  unchanged; submitters choose the version.

  The `fastq` step is identical to 1.0.0/1.1.0 — parse, count, mint a contiguous
  sequence_idx range, write reads.parquet. Minting happens here, before any
  filtering. `qc` and `host_filter` are additive transforms on that reads.parquet:
  pure reads → reads drops/trims keyed by the already-minted sequence_idx, so the
  surviving sequence_idx has benign gaps (still a unique sorted join key), never a
  re-mint. Each stage re-emits the `reads` binding it consumes (a transform
  in place), so the chain is fastq → qc → host_filter over one logical artifact.

  QC (`qc`) is a fastp-equivalent transform: adapter trim → optional polyG trim
  (gated on `instrument_model` being a 2-color instrument) → length/quality
  filter (fastp `-l 100`). It is ALWAYS ON (no gate) — every 1.2.0 run is QC'd.
  Listing `adapter_parquet` in its inputs signals the runner to materialize the
  canonical adapter set (the configured artifact_sequence_set reference) before
  the step loop.

  Host filtering is GATED. When action_context sets `host_filter_enabled: true`,
  `host_rype_reference_idx` names an ACTIVE reference whose rype (.ryxdi) index is
  bound (required), and the optional `host_minimap2_reference_idx` names a second
  ACTIVE reference whose minimap2 (.mmi) index is bound — two INDEPENDENT
  references, one per tool (the runner's _resolve_host_filter_indexes resolves
  them and 400s the submission otherwise). host_filter drops reads matching
  either (rype first, then minimap2 on rype's survivors; paired-end pairs drop if
  either mate hits). When disabled (or omitted) host_filter's index inputs stay
  unbound and it is a pass-through copy — reads unchanged.

  Per-sample scope (target_kind: prep_sample); the route's submit-time check
  rejects tickets pointing at non-sequenced preps. The orchestrator
  authenticates sequence-range mint with the compute service-account PAT, so the
  submitter does not need sequence_range:mint on their own token.

# The persist-read-metrics action writes the per-stage read counts onto the
# sample's sequenced_sample (prep_sample subtype) row, so submitters must hold
# prep_sample:write (in the USER ceiling, so the audience below is unaffected).
scopes:
  - prep_sample:write

audience:
  service: false
  human_roles: [user, wet_lab_admin, system_admin]

context_schema:
  type: object
  required: [fastq_path]
  properties:
    fastq_path:
      type: string
      minLength: 1
      pattern: "^/"
    reverse_fastq_path:
      type: string
      minLength: 1
      pattern: "^/"
    # Sequencing instrument model (e.g. "NextSeq 550"), forwarded per sample from
    # qiita.sequencing_run. The qc step gates polyG trimming on a 2-color model
    # (NextSeq/NovaSeq/MiniSeq); absent/unknown → polyG OFF. Passed to the qc job
    # via the step's `params:` (instrument_model -> qc.Inputs.instrument_model).
    instrument_model:
      type: string
      minLength: 1
    # Host-filter gate. `host_filter_enabled` defaults off; when true,
    # `host_rype_reference_idx` (REQUIRED) names an ACTIVE reference carrying a
    # rype index, and `host_minimap2_reference_idx` (OPTIONAL) names an ACTIVE
    # reference carrying a minimap2 index — each from its OWN reference (the
    # two-reference layout; 1.1.0's single host_reference_idx is the legacy form).
    # The runner's _resolve_host_filter_indexes resolves them and 400s otherwise.
    # NOTE: these are plain reference idxs, NOT `*_upload_idx` — the upload-handle
    # walker only touches `_upload_idx` keys, so it leaves these alone.
    host_filter_enabled:
      type: boolean
    host_rype_reference_idx:
      type: integer
      minimum: 1
    host_minimap2_reference_idx:
      type: integer
      minimum: 1

steps:
  - step: fastq
    step_type: singleton
    module: qiita_compute_orchestrator.jobs.fastq_to_parquet
    inputs: [fastq_path]
    # `reverse_fastq_path` flows through only when the action_context carries it.
    optional_inputs: [reverse_fastq_path]
    # `raw_read_count` is the read_count.json sidecar: raw reads out of
    # bcl-convert, before qc/host_filter. The runner forwards it in `bound` for
    # a future per-sample persistence consumer.
    outputs: [reads, raw_read_count]
    baseline_resources:
      cpu: 2
      mem_gb: 8
      walltime: PT30M

  # fastqc-equivalent QC summary on the RAW reads (the fastq output, before qc
  # trims/filters). Must run BEFORE qc: it reports on the `reads` binding while
  # it is still fastq's output, and qc below re-emits `reads`. Emits the
  # `raw_qc_report` qc_report.json sidecar for the merged-report step.
  - step: qc_report_raw
    step_type: singleton
    module: qiita_compute_orchestrator.jobs.qc_report
    inputs: [reads]
    outputs: [raw_qc_report]
    baseline_resources:
      cpu: 2
      mem_gb: 8
      walltime: PT1H

  # Always-on QC on the minted reads. `adapter_parquet` is materialized by the
  # runner's _resolve_qc_adapters (triggered because this step lists it as an
  # input) before the step loop. `instrument_model` rides through `params:`
  # (un-Path-coerced) to gate polyG. Re-emits `reads` (the same binding it
  # consumes) so host_filter below sees the QC'd reads; the on-disk file is
  # qc_reads.parquet. No target_status: fastq-to-parquet tracks no lifecycle.
  - step: qc
    step_type: singleton
    module: qiita_compute_orchestrator.jobs.qc
    inputs: [reads, adapter_parquet]
    params: {instrument_model: instrument_model}
    # `biological_read_count` is the read_count.json sidecar: reads surviving
    # adapter + quality/length filtering, before host_filter (persist-read-metrics
    # persists it). The re-emitted `reads` binding is the QC'd reads.
    outputs: [reads, biological_read_count]
    # cpu=4 / mem_gb=12 sit above qc.py's DuckDB cap so resolve_duckdb_memory_gb
    # lands DuckDB near 8 GB after 4-thread headroom; QC holds no out-of-heap
    # co-consumer (unlike host_filter), so the whole allocation is DuckDB's.
    baseline_resources:
      cpu: 4
      mem_gb: 12
      walltime: PT2H

  # Optional host depletion on the QC'd reads. `host_rype_path` /
  # `host_minimap2_path` are bound by the runner's _resolve_host_filter_indexes
  # ONLY when host_filter_enabled — declared as optional_inputs so the step is a
  # pass-through (reads → filtered_reads unchanged) when host filtering is off.
  # Identical to the 1.1.0 host_filter step (consumes the `reads` binding, which
  # qc re-emitted) — host_filter.py is unchanged across both versions.
  - step: host_filter
    step_type: singleton
    module: qiita_compute_orchestrator.jobs.host_filter
    inputs: [reads]
    optional_inputs: [host_rype_path, host_minimap2_path]
    # `quality_filtered_read_count` is the read_count.json sidecar: reads
    # surviving host depletion (== the biological count on a pass-through, when
    # host filtering is disabled). The persist-read-metrics action below consumes it.
    outputs: [filtered_reads, quality_filtered_read_count]
    # mem_gb=16 / cpu=4 mirror host_filter.py's DuckDB cap (8 GB, half the
    # allocation) + threads (4). Genome-scale host-index sizing is deferred
    # (see host_filter.py): when sizing against a real host reference, bump
    # mem_gb AND reconsider walltime together — minimap2 short-read alignment
    # against a human-genome .mmi can exceed PT4H on 4 CPUs for a deep FASTQ.
    baseline_resources:
      cpu: 4
      mem_gb: 16
      walltime: PT4H

  # fastqc-equivalent QC summary on the host-filtered reads (the host_filter
  # output). The same qc_report module as qc_report_raw, selected by binding
  # `filtered_reads` instead of `reads`; emits the `filtered_qc_report` sidecar.
  - step: qc_report_filtered
    step_type: singleton
    module: qiita_compute_orchestrator.jobs.qc_report
    inputs: [filtered_reads]
    outputs: [filtered_qc_report]
    baseline_resources:
      cpu: 2
      mem_gb: 8
      walltime: PT1H

  # Persist the three per-stage read counts onto this prep_sample's 1:1
  # sequenced_sample row (raw / biological / quality-filtered, both-mates r1r2).
  # In-process control-plane action (direct DB write, no backend hop) — it reads
  # the read_count.json sidecars bound from fastq/qc/host_filter. Writing a
  # prep_sample subtype row is why the workflow now declares prep_sample:write
  # in `scopes` above.
  - action: persist-read-metrics
    inputs: [raw_read_count, biological_read_count, quality_filtered_read_count]
    outputs: []

  # Persist the two fastqc-equivalent QC reports onto this prep_sample's 1:1
  # sequenced_sample row (raw_qc_report / filtered_qc_report JSONB). In-process
  # control-plane action (direct DB write, no backend hop) — it reads the
  # qc_report.json sidecars bound from the qc_report_raw / qc_report_filtered
  # steps. The pool-scoped merged report endpoint aggregates these on read.
  # Same prep_sample:write scope already declared for persist-read-metrics.
  - action: persist-qc-report
    inputs: [raw_qc_report, filtered_qc_report]
    outputs: []

# The ceiling must stay ABOVE every step's baseline on the escalating axes
# (mem_gb, walltime): escalation grows the floor and clamps here, so a baseline
# that has reached the ceiling has no rung to climb to and the runner fails the
# ticket permanently at retry_count=0 instead of retrying larger. Mechanism in
# runner/_dispatch.py; enforced for every shipped workflow by
# test_no_step_baseline_sits_at_the_action_ceiling_on_an_escalating_axis.
# Step baselines are untouched, so an ordinary ticket requests exactly what it
# did before and schedules identically — only a *failing* step climbs. (That
# holds while no at-ceiling step exposes a plan() hint: the down-size gate in
# _resolve_baseline_for_step is `hint < resolved < ceiling`, so raising a
# ceiling can newly enable a down-size for a step that has one. None here do.)
# cpu and gpu are exempt: nothing escalates them.
#
# host_filter is the same jobs.host_filter module in every version that runs it,
# so its sizing carries across; the 32 GB figures below were measured on
# read-mask/1.0.0 and fastq-to-parquet/1.3.0, which is where a 32 GB request
# was reachable (#209 raised their baseline AND ceiling to 32 together — the
# very edit that created the dead ladder this ceiling raise now fixes).
#
# 32 is measured, not doubled on principle: host_filter demonstrably exceeds
# 16 GB (a run of OOM-killed jobs at that request) and the same samples complete
# at 32 GB peaking at 22.0 / 22.6 / 25.8 GB, so the first rung lands exactly on
# the size that works. Those peaks are real demand, not an allocation artifact —
# host_filter deliberately does NOT size DuckDB from the cgroup (see the comment
# on _DUCKDB_MEMORY_GB in jobs/host_filter.py), so its RSS does not expand to
# fill whatever it is given. walltime PT8H doubles PT4H against ~15 min observed
# runtimes: pure headroom.
action_ceiling:
  cpu: 8
  mem_gb: 32
  walltime: PT8H
