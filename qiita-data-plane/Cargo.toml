[package]
name = "qiita-data-plane"
version = "2026.3.0"
edition = "2021"

[[bin]]
name = "qiita-data-plane"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
# `gzip`/`zstd` enable tonic's per-message gRPC compression. Inert until a
# service calls `send_compressed`/`accept_compressed`, which nothing does — they
# are here so the transport layer is measurable against IPC body compression
# (which layer wins is the M0 question; gzip is the codec every gRPC client
# supports, zstd the one comparable to the IPC codec).
tonic = { version = "0.14", features = ["gzip", "zstd"] }
tonic-health = "0.14"
# tonic-reflection lets grpcurl introspect this server's services
# without a local .proto file — exposed for operator-tooling
# (`make verify-health`). Internal callers don't need reflection.
# See issue #54 for the failure mode this fixes.
tonic-reflection = "0.14"
arrow-flight = "58"
arrow-array = "58"
arrow-schema = "58"
# Direct only to turn on the IPC body codecs. `arrow-flight` pulls `arrow-ipc`
# with no features, and the format defines exactly these two — without them
# `IpcWriteOptions::batch_compression_type` is a runtime error, not a fallback.
# Compression stays opt-in per stream; the encoder default is still no codec.
arrow-ipc = { version = "58", features = ["lz4", "zstd"] }
# DoPut writes incoming Arrow stream as Parquet directly. The data plane's
# embedded DuckDB cannot ingest an arbitrary Arrow schema without C-API
# gymnastics, so the parquet crate from the arrow-rs ecosystem is the
# cleanest path. Keep version pinned to arrow-* major.
parquet = "58"
duckdb = { version = "1.10504.0" }
# Pin the feature set explicitly (these are v2's current defaults) so a future
# upstream default-feature change can't silently alter behavior on a bare
# `cargo update`. `rand_core` is deliberately omitted — the data plane only ever
# verifies, never signs, so it needs no key generation.
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "std", "zeroize"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
futures = "0.3.31"

[features]
# Enable tests that require external services (Postgres on :5433).
# Run with: cargo test --features integration
integration = []
# The M0 compression measurement run over local-only production fixtures
# (`localdocs/ducklake-sampled-data/`, or `$QIITA_M0_FIXTURES`). Deliberately in
# no `make` tier: the data is not in the repo, so opting in asserts you have it.
# Run with: cargo test --release --features fixtures -- --nocapture
fixtures = []

[dev-dependencies]
serial_test = "3"
tempfile = "3"
# The compression harness sizes each `FlightData` by its protobuf-encoded
# length — what tonic puts on the wire, not an estimate of it.
prost = "0.14"
# Phase 4 calibration casts a transformed column back to its original type to
# assert the transform preserved every value. Test-only; the service never casts.
arrow-cast = "58"
